name: Update Contribution Activity Graph

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: gireeshvpai2007-maker
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          from datetime import datetime, timedelta

          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          today = datetime.utcnow()
          from_date = today - timedelta(days=365)

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": USERNAME,
                  "from": from_date.strftime("%Y-%m-%dT00:00:00Z"),
                  "to": today.strftime("%Y-%m-%dT23:59:59Z")
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise RuntimeError(json.dumps(result["errors"], indent=2))

          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda x: x["date"])

          # Create a clean weekly activity line graph.
          weekly = []

          for i in range(0, len(days), 7):
              chunk = days[i:i + 7]

              if chunk:
                  weekly.append({
                      "date": chunk[-1]["date"],
                      "count": sum(day["count"] for day in chunk)
                  })

          width = 1000
          height = 300

          left = 55
          right = 25
          top = 35
          bottom = 55

          graph_width = width - left - right
          graph_height = height - top - bottom

          max_count = max((x["count"] for x in weekly), default=1)

          points = []

          for i, item in enumerate(weekly):
              if len(weekly) == 1:
                  x = left
              else:
                  x = left + (i / (len(weekly) - 1)) * graph_width

              y = top + graph_height - (
                  item["count"] / max_count
              ) * graph_height

              points.append((x, y, item["count"], item["date"]))

          polyline = " ".join(
              f"{x:.2f},{y:.2f}" for x, y, _, _ in points
          )

          area = (
              f"{left},{top + graph_height} "
              + polyline
              + f" {left + graph_width},{top + graph_height}"
          )

          # Select approximately 6 date labels.
          label_indices = []

          if points:
              step = max(1, len(points) // 6)
              label_indices = list(range(0, len(points), step))[:6]

          labels = []

          for index in label_indices:
              x, y, count, date = points[index]
              label = datetime.strptime(date, "%Y-%m-%d").strftime("%b %Y")

              labels.append(
                  f'<text x="{x:.2f}" y="{height - 20}" '
                  f'text-anchor="middle" class="label">{label}</text>'
              )

          total = calendar["totalContributions"]

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="{width}" height="{height}"
          viewBox="0 0 {width} {height}">

          <style>
            .title {{
              font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
              fill: #24292f;
            }}

            .label {{
              font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
              fill: #57606a;
            }}

            .grid {{
              stroke: #d8dee4;
              stroke-width: 1;
            }}

            .line {{
              fill: none;
              stroke: #2da44e;
              stroke-width: 3;
              stroke-linecap: round;
              stroke-linejoin: round;
            }}

            .area {{
              fill: #2da44e;
              opacity: 0.10;
            }}

            .point {{
              fill: #2da44e;
            }}

            @media (prefers-color-scheme: dark) {{
              .title {{
                fill: #f0f6fc;
              }}

              .label {{
                fill: #8b949e;
              }}

              .grid {{
                stroke: #30363d;
              }}

              .line {{
                stroke: #3fb950;
              }}

              .area {{
                fill: #3fb950;
              }}

              .point {{
                fill: #3fb950;
              }}
            }}
          </style>

          <text x="{left}" y="25" class="title">
            GitHub Contribution Activity — {total} contributions
          </text>

          <line x1="{left}" y1="{top}"
                x2="{left}" y2="{top + graph_height}"
                class="grid"/>

          <line x1="{left}" y1="{top + graph_height / 2}"
                x2="{left + graph_width}" y2="{top + graph_height / 2}"
                class="grid"/>

          <line x1="{left}" y1="{top + graph_height}"
                x2="{left + graph_width}" y2="{top + graph_height}"
                class="grid"/>

          <polygon points="{area}" class="area"/>

          <polyline points="{polyline}" class="line"/>

          {"".join(
              f'<circle cx="{x:.2f}" cy="{y:.2f}" r="2.5" class="point">'
              f'<title>{date}: {count} contributions</title>'
              f'</circle>'
              for x, y, count, date in points
          )}

          {"".join(labels)}

          </svg>
          '''

          os.makedirs("assets", exist_ok=True)

          with open("assets/activity-graph.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print(f"Generated graph with {total} total contributions.")
          PY

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update contribution activity graph"
            git push
          fi
