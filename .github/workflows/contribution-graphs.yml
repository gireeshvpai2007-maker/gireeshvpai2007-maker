name: Generate Contribution Graphs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/contribution-graphs.yml'
      - 'scripts/contribution_graphs.py'
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate graphs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/contribution_graphs.py

      - name: Commit generated SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-graph.svg assets/contribution-journey.svg
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: update contribution graphs'
            git push
          fi
