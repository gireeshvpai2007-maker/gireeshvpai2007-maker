# gh-ascii — daily profile card refresh

name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Download both themes
        env:
          HANDLE: gireeshvpai2007-maker
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark&cols=60" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light&cols=60" \
            -o light_mode.svg

      - name: Update README cache-buster only when the card changed
        id: changed
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Card unchanged."
            exit 0
          fi

          VERSION=$(date -u +%Y%m%d%H%M%S)
          sed -i -E \
            "s#dark_mode\\.svg(\\?v=[0-9]+)?#dark_mode.svg?v=$VERSION#g; \
             s#light_mode\\.svg(\\?v=[0-9]+)?#light_mode.svg?v=$VERSION#g" \
            README.md

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Cache version: $VERSION"

      - name: Commit refreshed card
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg README.md
          git commit -m "chore: refresh gh-ascii card"
          git push
